version: '3.8'

services:
  # Database Service
  db:
    image: mysql:8.0
    container_name: smartcart_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: smartcart_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - smartcart_network

  # Backend API Service
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcart_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:rootpassword123@db:3306/smartcart_db
      - SECRET_KEY=supersecretkey_for_jwt_auth_12345
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - db
    networks:
      - smartcart_network
    command: >
      sh -c "alembic upgrade head && 
             python -m app.database.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Frontend UI Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartcart_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - smartcart_network

volumes:
  db_data:

networks:
  smartcart_network:
    driver: bridge
